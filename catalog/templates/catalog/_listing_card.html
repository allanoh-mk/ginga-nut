<li class="product-card">
  <a class="product-card__link" href="{% url 'catalog:listing' listing.pk %}">
    <span class="product-card__media">{% if listing.image %}<img src="{{ listing.image.url }}" alt="{{ listing.title }}" width="640" height="640" loading="lazy" decoding="async">{% else %}<span class="sr-only">{{ listing.title }}</span>{% endif %}</span>
    <span class="product-card__title">{{ listing.title }}</span>
  </a>
  <span class="product-card__vendor">{{ listing.vendor.user.username }}</span>
  <span class="price">{{ listing.price_base }} base</span>
  {% if listing.review_count %}
    <span class="product-card__rating" aria-label="Average rating {{ listing.average_rating|floatformat:1 }} out of 5">
      {{ listing.average_rating|floatformat:1 }} / 5 · {{ listing.review_count }}
    </span>
  {% endif %}
</li>
