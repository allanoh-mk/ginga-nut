repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check --fix .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format .
        language: system
        pass_filenames: false
      - id: pytest
        name: Full test suite
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
