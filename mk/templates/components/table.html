<div class="table-wrap" role="region" aria-label="{{ caption }}" tabindex="0">
  <table class="data-table">
    <caption>{{ caption }}</caption>
    <thead><tr>{% for heading in headings %}<th scope="col">{{ heading }}</th>{% endfor %}</tr></thead>
    <tbody>{% for row in rows %}<tr>{% for cell in row %}<td data-label="{% if forloop.counter == 1 %}{{ headings.0 }}{% elif forloop.counter == 2 %}{{ headings.1 }}{% elif forloop.counter == 3 %}{{ headings.2 }}{% elif forloop.counter == 4 %}{{ headings.3 }}{% elif forloop.counter == 5 %}{{ headings.4 }}{% elif forloop.counter == 6 %}{{ headings.5 }}{% elif forloop.counter == 7 %}{{ headings.6 }}{% elif forloop.counter == 8 %}{{ headings.7 }}{% elif forloop.counter == 9 %}{{ headings.8 }}{% elif forloop.counter == 10 %}{{ headings.9 }}{% elif forloop.counter == 11 %}{{ headings.10 }}{% elif forloop.counter == 12 %}{{ headings.11 }}{% endif %}">{{ cell }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="{{ headings|length }}">No records.</td></tr>{% endfor %}</tbody>
  </table>
</div>
