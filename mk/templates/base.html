<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% url 'site-stylesheet' %}">
    <title>{% block title %}Kola Market{% endblock %}</title>
    {% block head %}{% endblock %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "partials/header.html" %}
    <div class="flash-region" aria-live="polite" aria-atomic="true">
      {% if messages %}
        {% for message in messages %}
          <p class="flash flash--{{ message.tags|default:'info' }}">{{ message }}</p>
        {% endfor %}
      {% endif %}
    </div>
    <div class="app-layout">
      {% include "partials/sidebar.html" %}
      <div class="app-main">
        <main class="page-shell" id="main-content">{% block content %}{% endblock %}</main>
        {% include "partials/footer.html" %}
      </div>
    </div>
    <script src="/static/js/kola.js" defer></script>
  </body>
</html>
